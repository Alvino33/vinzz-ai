name: VinAI compute

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Pesan untuk VinAI"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  inference:
    # Private-repository standard runners have limited CPU/RAM and no GPU.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git curl

      - name: Build llama.cpp (CPU)
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git
          cmake -S llama.cpp -B llama.cpp/build -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF
          cmake --build llama.cpp/build --config Release -j2

      - name: Download Qwen coding model
        run: |
          python -m pip install --upgrade huggingface_hub
          hf download bartowski/Qwen2.5-Coder-3B-Instruct-GGUF Qwen2.5-Coder-3B-Instruct-Q4_K_M.gguf --local-dir models

      - name: Run inference
        env:
          PROMPT: ${{ inputs.prompt }}
        run: |
          printf '%s\n' "$PROMPT" > prompt.txt
          llama.cpp/build/bin/llama-cli \
            -m models/Qwen2.5-Coder-3B-Instruct-Q4_K_M.gguf \
            -f prompt.txt \
            -c 4096 -n 768 --temp 0.2 --no-display-prompt \
            > response.txt 2> inference.log
          test -s response.txt

      - name: Upload response
        uses: actions/upload-artifact@v4
        with:
          name: vinai-response
          path: response.txt
          retention-days: 1
