name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Generate Android Folder
        run: flutter create . --platforms=android --project-name=offline_ai_chat

      - name: Clean Cache
        run: flutter clean

      - name: Get Dependencies
        run: flutter pub get

      - name: CEK ERROR KODE (Penting!)
        run: flutter analyze lib

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nusa-ai-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
